<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer circle and border -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#4A0404" stroke-width="8" />
  
  <!-- Golden arch above the cloche -->
  <path d="M 170 200 A 90 90 0 0 1 330 200" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="2 1" opacity="0.3" />
  <path d="M 160 210 A 110 110 0 0 1 340 210" fill="none" stroke="#D4AF37" stroke-width="4" />
  
  <!-- Golden Cloche / Food Cover -->
  <path d="M 210 180 C 210 140, 290 140, 290 180 Z" fill="#D4AF37" />
  <path d="M 205 180 L 295 180 C 298 180, 298 184, 295 184 L 205 184 C 202 184, 202 180, 205 180 Z" fill="#D4AF37" />
  
  <!-- Cloche Steam / Ornament on Top -->
  <path d="M 250 140 C 250 125, 243 120, 240 120 C 245 120, 250 115, 250 100 C 250 115, 255 120, 260 120 C 257 120, 250 125, 250 140 Z" fill="#D4AF37" />
  <circle cx="250" cy="142" r="3" fill="#4A0404" />
  
  <path d="M 235 128 C 230 125, 228 128, 225 130 C 228 132, 232 131, 235 128 Z" fill="#D4AF37" />
  <path d="M 265 128 C 270 125, 272 128, 275 130 C 272 132, 268 131, 265 128 Z" fill="#D4AF37" />

  <!-- Kannada Text "ಅತಿಥಿ" (Atithi) in customized vector shapes or beautiful font -->
  <!-- Note: We can render using SVG text with Noto Serif Kannada, but to make it look highly stylized and independent of installed fonts, we can draw a beautiful text representation or use clean SVG text styling. Let's use a robust font stack with fallbacks and strong styles -->
  <text x="250" y="280" font-family="'Noto Serif Kannada', 'Tunga', 'Hubballi', 'Lohit Kannada', 'Kedage', 'Segoe UI', serif" font-size="95" font-weight="800" fill="#800020" text-anchor="middle" letter-spacing="-1">ಅತಿಥಿ</text>
  
  <!-- Middle Divider -->
  <g>
    <!-- Left line -->
    <line x1="110" y1="310" x2="220" y2="310" stroke="#D4AF37" stroke-width="2.5" />
    <circle cx="110" cy="310" r="3" fill="#D4AF37" />
    
    <!-- Floral center accent -->
    <path d="M 250 300 C 250 310, 245 310, 245 310 C 245 310, 250 310, 250 320 C 250 310, 255 310, 255 310 C 255 310, 250 310, 250 300 Z" fill="#D4AF37" />
    <path d="M 240 310 C 245 305, 245 310, 245 310 C 245 310, 245 315, 240 310 Z" fill="#D4AF37" />
    <path d="M 260 310 C 255 305, 255 310, 255 310 C 255 310, 255 315, 260 310 Z" fill="#D4AF37" />
    
    <!-- Right line -->
    <line x1="280" y1="310" x2="390" y2="310" stroke="#D4AF37" stroke-width="2.5" />
    <circle cx="390" cy="310" r="3" fill="#D4AF37" />
  </g>
  
  <!-- Text EVENTS & CATERING -->
  <text x="250" y="348" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="4.5" text-anchor="middle">EVENTS &amp; CATERING</text>
  
  <!-- Bottom Divider -->
  <g>
    <line x1="170" y1="375" x2="235" y2="375" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="170" cy="375" r="2.5" fill="#D4AF37" />
    
    <path d="M 250 370 C 250 375, 247 375, 247 375 C 247 375, 250 375, 250 380 C 250 375, 253 375, 253 375 C 253 375, 250 375, 250 370 Z" fill="#D4AF37" />
    
    <line x1="265" y1="375" x2="330" y2="375" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="330" cy="375" r="2.5" fill="#D4AF37" />
  </g>
</svg>
